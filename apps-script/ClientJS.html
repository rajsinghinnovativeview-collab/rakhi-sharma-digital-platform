<script>
(()=>{
'use strict';
const API=(window.RAKHI_CONFIG||{}).appScriptUrl;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const state={products:[],experiences:[],info:[],content:[],cart:JSON.parse(localStorage.getItem('rakhi_cart')||'[]'),token:sessionStorage.getItem('rakhi_session')||'',user:null,authMode:'login',dashboard:null,staffData:null,staffTab:'orders'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Number.isFinite(Number(n))?'₹'+Number(n).toLocaleString('en-IN'):'';
const text=(v,max=2000)=>String(v||'').slice(0,max);
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),4200)}
function setStatus(id,msg,type=''){const e=$('#'+id);if(e){e.textContent=msg;e.className='status '+type}}
function jsonp(action){if(window.google&&google.script&&google.script.run)return new Promise(resolve=>google.script.run.withSuccessHandler(resolve).gsPublic(action));return new Promise((resolve,reject)=>{if(!API)return reject(Error('Apps Script URL is missing.'));const callback='rakhiJsonp_'+Date.now()+'_'+Math.random().toString(36).slice(2);const script=document.createElement('script');const timer=setTimeout(()=>finish(Error('The Google Sheets endpoint did not respond.')),18000);function finish(err,val){clearTimeout(timer);delete window[callback];script.remove();err?reject(err):resolve(val)}window[callback]=data=>finish(null,data);script.onerror=()=>finish(Error('Could not reach the Apps Script web app. Check its deployment access setting.'));script.src=API+'?action='+encodeURIComponent(action)+'&callback='+callback;document.head.append(script)})}
async function post(action,data={}){if(window.google&&google.script&&google.script.run)return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(result=>result&&result.ok===false?reject(Error(result.error||'The request could not be completed.')):resolve(result)).withFailureHandler(err=>reject(Error(err&&err.message||'Apps Script call failed.'))).gsApi({action,...data}));if(!API)throw Error('Apps Script URL is missing.');const response=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...data})});const raw=await response.text();let result;try{result=JSON.parse(raw)}catch{throw Error('Apps Script returned an unreadable response. Check that the latest Code.gs deployment is active.')}if(!response.ok||result.ok===false)throw Error(result.error||'The request could not be completed.');return result}
function route(){let key=location.hash.replace('#','')||'home';const names=['home','art','commissions','orchha','account','cart','workspace'];if(!names.includes(key))key='home';$$('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+key));$$('[data-route]').forEach(a=>{a.classList.toggle('active',a.dataset.route===key);if(a.tagName==='A')a.href='#'+a.dataset.route});$('#nav').classList.remove('open');window.scrollTo(0,0);if(key==='cart')renderCart();if(key==='account')loadDashboard();if(key==='workspace'&&state.staffData)renderStaff();}
function persistCart(){localStorage.setItem('rakhi_cart',JSON.stringify(state.cart));$('#cart-count').textContent=state.cart.reduce((n,x)=>n+x.quantity,0);$('#mobile-cart-count').textContent=state.cart.reduce((n,x)=>n+x.quantity,0)}
function addCart(id){const p=state.products.find(x=>String(x['Artc ID'])===String(id));if(!p)return;const line=state.cart.find(x=>String(x.id)===String(id));if(line)line.quantity=Math.min(10,line.quantity+1);else state.cart.push({id:String(id),quantity:1});persistCart();toast('Added to your bag.');}
function productCard(p){const id=esc(p['Artc ID']),title=esc(p.Title),img=String(p['Image URL']||'');const image=/^https:\/\//i.test(img)?`<img src="${esc(img)}" alt="${title}" loading="lazy">`:'<div class="product-img-placeholder" aria-hidden="true"></div>';const price=money(p.Price);return `<article class="product">${image}<div class="product-body"><span class="pill">${esc(p.Category||p['Artwork Type']||'Artwork')}</span><h3>${title}</h3><p>${esc(text(p.Description,200))}</p><div class="product-meta"><span class="price">${price}</span><button class="btn small" data-add="${id}">Add to bag</button></div></div></article>`}
function empty(msg,sub=''){return `<div class="empty"><strong>${esc(msg)}</strong>${esc(sub)}</div>`}
function renderProducts(){const q=($('#search')?.value||'').trim().toLowerCase(),cat=$('#category')?.value||'',sort=$('#sort')?.value||'featured';let items=state.products.filter(p=>(!cat||String(p.Category||'')===cat)&&(!q||[p.Title,p.Description,p.Category,p.Medium].join(' ').toLowerCase().includes(q)));if(sort==='low')items.sort((a,b)=>Number(a.Price)-Number(b.Price));if(sort==='high')items.sort((a,b)=>Number(b.Price)-Number(a.Price));if(sort==='featured')items.sort((a,b)=>(String(b.Featured).toLowerCase()==='true'?1:0)-(String(a.Featured).toLowerCase()==='true'?1:0));$('#products').innerHTML=items.length?items.map(productCard).join(''):empty('No published artwork yet','Rakhi’s published catalogue will appear here.');const featured=state.products.filter(p=>String(p.Featured).toLowerCase()==='true').slice(0,3);$('#featured-products').innerHTML=featured.length?featured.map(productCard).join(''):state.products.slice(0,3).map(productCard).join('')||empty('The collection is being prepared','Published artwork will appear here when available.');const select=$('#category'),old=select.value,cats=[...new Set(state.products.map(p=>String(p.Category||'').trim()).filter(Boolean))];select.innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');select.value=cats.includes(old)?old:''}
function renderExperiences(){const root=$('#experiences');root.innerHTML=state.experiences.length?state.experiences.map((x,i)=>`<article class="card">${x['Image URL']&&/^https:\/\//i.test(x['Image URL'])?`<img src="${esc(x['Image URL'])}" alt="${esc(x.Title)}" style="width:100%;height:180px;object-fit:cover;margin-bottom:12px">`:''}<span class="number">${String(i+1).padStart(2,'0')}</span><h3>${esc(x.Title)}</h3><p>${esc(text(x.Description,400))}</p><p style="margin-top:9px"><b>${esc(x.Duration||'')}</b>${x['Price INR']!==''?' · '+money(x['Price INR']):''}</p><p>Meeting point: ${esc(x['Meeting Point']||'Contact Rakhi')}</p><button class="btn small" data-experience="${esc(x['Experience ID'])}" data-exp-title="${esc(x.Title)}">Ask about this</button></article>`).join(''):empty('No verified experiences are published','Visitor experience listings appear after verification and publication.')}
function renderInfo(){const root=$('#information');root.innerHTML=state.info.length?state.info.map((x,i)=>`<article class="card"><span class="number">${String(i+1).padStart(2,'0')}</span><h3>${esc(x.Title||x.Section)}</h3><p>${esc(text(x.Details,500))}</p>${x['Address or Meeting Point']?`<p style="margin-top:9px"><b>Location:</b> ${esc(x['Address or Meeting Point'])}</p>`:''}${x['Verified Contact']?`<p style="margin-top:6px"><b>Contact:</b> ${esc(x['Verified Contact'])}</p>`:''}<small>Verified ${esc(x['Verified On']||'')}</small></article>`).join(''):empty('No verified visitor information yet','Information will show after an owner records its source and verification.')}
async function loadPublic(){const status=$('#connection');try{const d=await jsonp('bootstrap');if(!d||d.ok===false)throw Error(d?.error||'Apps Script returned an error.');state.products=d.products||[];state.experiences=d.experiences||[];state.info=d.info||[];state.content=d.content||[];if(d.user)state.user=d.user;renderProducts();renderExperiences();renderInfo();status.textContent=`Connected to Google Sheets · ${state.products.length} artwork listing${state.products.length===1?'':'s'} published`;status.className='notice status ok';}catch(e){status.textContent='Catalogue connection unavailable: '+e.message+' Use the deployed Apps Script URL and allow public access to read published data.';status.className='notice status error';$('#products').innerHTML=empty('Could not load the catalogue','Check the Apps Script deployment and try again.');$('#experiences').innerHTML=empty('Could not load experiences');$('#information').innerHTML=empty('Could not load visitor information')}}
function renderCart(){persistCart();const root=$('#cart-lines'),items=state.cart.map(line=>({...line,product:state.products.find(p=>String(p['Artc ID'])===String(line.id))})).filter(x=>x.product);if(!items.length){root.innerHTML=empty('Your bag is empty','Browse the art studio to add an available piece.');$('#checkout').hidden=true;$('#signin-checkout').hidden=true;return}root.innerHTML=items.map(x=>`<div class="list-item"><div><b>${esc(x.product.Title)}</b><br><small>${money(x.product.Price)} each · Qty <input data-qty="${esc(x.id)}" type="number" value="${x.quantity}" min="1" max="10" style="width:58px;padding:4px;border:1px solid var(--line)"></small></div><b>${money(Number(x.product.Price)*x.quantity)}</b><button data-remove="${esc(x.id)}" aria-label="Remove ${esc(x.product.Title)}" style="border:0;background:none;color:#9b4c3d">Remove</button></div>`).join('')+`<div class="list-item"><b>Subtotal estimate</b><b>${money(items.reduce((n,x)=>n+Number(x.product.Price)*x.quantity,0))}</b></div>`;$('#checkout').hidden=!state.token;$('#signin-checkout').hidden=!!state.token}
function formObject(form){const out={};new FormData(form).forEach((v,k)=>{if(k==='marketingConsent')out[k]=true;else out[k]=String(v)});return out}
async function submitForm(form,action,statusId,extra={}){const btn=$('button[type="submit"]',form);if(btn)btn.disabled=true;setStatus(statusId,'Sending…');try{const data={...formObject(form),...extra};const result=await post(action,data);setStatus(statusId,result.message||'Request received.','ok');form.reset();toast(result.message||'Request received.');return result}catch(e){setStatus(statusId,e.message,'error');return null}finally{if(btn)btn.disabled=false}}
function setAuthMode(mode){state.authMode=mode;$$('[data-auth-tab]').forEach(b=>b.classList.toggle('active',b.dataset.authTab===mode));$$('[data-register]').forEach(x=>x.hidden=mode!=='register');$('#verify-field').hidden=mode!=='verify';$('#password-field').hidden=mode==='verify';$('#auth-password').required=mode!=='verify';$('#auth-submit').textContent=mode==='login'?'Sign in':mode==='register'?'Create account':'Verify email';$('#reset-start').hidden=mode!=='login';setStatus('auth-status','')}
async function loadDashboard(){if(!state.token){$('#auth-panel').hidden=false;$('#account-dashboard').hidden=true;return}try{const d=await post('dashboard',{token:state.token});state.dashboard=d;$('#auth-panel').hidden=true;$('#account-dashboard').hidden=false;$('#account-name').textContent='Welcome, '+(d.user?.['Full Name']||'');renderDashboard('orders')}catch(e){state.token='';sessionStorage.removeItem('rakhi_session');$('#auth-panel').hidden=false;$('#account-dashboard').hidden=true;setStatus('auth-status',e.message,'error')}}
function renderDashboard(key){const root=$('#dashboard-list'),arr=state.dashboard?.[key]||[];root.innerHTML=arr.length?arr.map(x=>`<article class="list-item"><div><b>${esc(x['Item Summary']||x.Title||x['Request Type']||x['Artwork Type']||x.Details||'Update')}</b><br><small>${esc(x['Order ID']||x['Enquiry ID']||x['Request ID']||x.Category||'')} · ${esc(x['Created At']||'')}</small>${x['Staff Response']?`<p>${esc(x['Staff Response'])}</p>`:''}</div><span class="badge">${esc(x['Order Status']||x.Status||'Update')}</span></article>`).join(''):empty('Nothing here yet','Your requests and updates will appear here.')}
async function loginWith(data){const r=await post('login',data);state.token=r.token;state.user=r.user;sessionStorage.setItem('rakhi_session',r.token);await loadDashboard();toast('Signed in.');}
async function startReset(email){const r=await post('startpasswordreset',{email});toast(r.message||'If this account exists, a reset code has been sent.');}
function renderStaff(){if(!state.staffData)return;$('#staff-login').hidden=true;$('#staff-panel').hidden=false;$('#staff-role').textContent='Signed in · role: '+(state.staffData.role||'staff');const key=state.staffTab,arr=state.staffData[key]||[];$('#staff-list').innerHTML=arr.length?arr.map(x=>{const id=x['Order ID']||x['Enquiry ID']||x['Request ID']||x['Experience ID']||x['Content ID'];const title=x['Item Summary']||x.Title||x['Request Type']||x['Artwork Type']||x.Details||'Record';const cur=key==='orders'?x['Order Status']:key==='experiences'||key==='content'?x.Status:x.Status;const options=key==='orders'?['New','Accepted','In progress','Ready for dispatch','Dispatched','Completed','Cancelled']:key==='art'?['New','Contacted','In progress','Completed','Closed']:key==='tfc'?['New','Contacted','Confirmed','Closed']:key==='experiences'?['Draft','Published','Unavailable']:['Draft','Published','Archived'];const type=key==='orders'?'orders':key==='art'?'art':key==='tfc'?'tfc':key;return `<article class="list-item"><div><b>${esc(title)}</b><br><small>${esc(id||'')} · ${esc(x.Email||'')} · ${esc(x['Created At']||'')}</small><p>${esc(text(x.Description||x.Message||'',300))}</p></div><div><span class="badge">${esc(cur||'')}</span><div style="margin-top:9px"><select data-admin-type="${type}" data-admin-id="${esc(id)}" aria-label="Update ${esc(title)} status">${options.map(s=>`<option ${s===cur?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div></article>`}).join(''):empty('No records','New requests will appear here.')}
async function loadStaff(){try{state.staffData=await post('admindashboard',{token:state.token});renderStaff()}catch(e){setStatus('staff-status',e.message,'error')}}
// Navigation and interactions.
$$('[data-route]').forEach(a=>a.addEventListener('click',()=>{if(location.hash==='#'+a.dataset.route)route()}));window.addEventListener('hashchange',route);$('#menu').addEventListener('click',()=>$('#nav').classList.toggle('open'));$('#year').textContent=new Date().getFullYear();route();persistCart();
$('#search').addEventListener('input',renderProducts);$('#category').addEventListener('change',renderProducts);$('#sort').addEventListener('change',renderProducts);
document.addEventListener('click',async e=>{const add=e.target.closest('[data-add]');if(add){addCart(add.dataset.add);return}const rem=e.target.closest('[data-remove]');if(rem){state.cart=state.cart.filter(x=>x.id!==rem.dataset.remove);renderCart();return}const exp=e.target.closest('[data-experience]');if(exp){$('#tfc-form').scrollIntoView({behavior:'smooth'});const t=$('#tfc-request [name=requestType]');t.value='Experience enquiry';const msg=$('#tfc-request [name=message]');msg.value='I would like to know more about '+exp.dataset.expTitle+'. ';msg.focus();return}const authTab=e.target.closest('[data-auth-tab]');if(authTab){setAuthMode(authTab.dataset.authTab);return}const dashTab=e.target.closest('[data-dash-tab]');if(dashTab){$$('[data-dash-tab]').forEach(x=>x.classList.toggle('active',x===dashTab));renderDashboard(dashTab.dataset.dashTab);return}const staffTab=e.target.closest('[data-staff-tab]');if(staffTab){state.staffTab=staffTab.dataset.staffTab;$$('[data-staff-tab]').forEach(x=>x.classList.toggle('active',x===staffTab));renderStaff();return}const upd=e.target.closest('[data-admin-type]');if(upd&&upd.tagName!=='SELECT'){return}});
document.addEventListener('change',async e=>{if(e.target.matches('[data-qty]')){const line=state.cart.find(x=>x.id===e.target.dataset.qty);if(line)line.quantity=Math.max(1,Math.min(10,Number(e.target.value)||1));renderCart()}if(e.target.matches('[data-admin-type]')){try{const r=await post('adminupdate',{token:state.token,type:e.target.dataset.adminType,id:e.target.dataset.adminId,status:e.target.value});toast(r.message||'Updated.');await loadStaff()}catch(err){toast(err.message);await loadStaff()}}});
$('#art-form').addEventListener('submit',e=>{e.preventDefault();submitForm(e.currentTarget,'artenquiry','art-status',{token:state.token})});$('#tfc-request').addEventListener('submit',e=>{e.preventDefault();submitForm(e.currentTarget,'tfcrequest','tfc-status',{token:state.token})});
$('#auth-form').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,d=formObject(f);const b=$('#auth-submit');b.disabled=true;setStatus('auth-status','Working…');try{if(state.authMode==='register'){const r=await post('signup',d);setStatus('auth-status',r.message||'Check your email for a verification code.','ok');setAuthMode('verify')}else if(state.authMode==='verify'){const r=await post('verifyemail',{email:d.email,code:d.code});setStatus('auth-status',r.message||'Email verified. Sign in now.','ok');setAuthMode('login')}else{await loginWith({email:d.email,password:d.password})}}catch(err){setStatus('auth-status',err.message,'error')}finally{b.disabled=false}});
$('#reset-start').addEventListener('click',async()=>{const email=$('#auth-email').value;if(!email){setStatus('auth-status','Enter your email first.','error');return}try{await startReset(email)}catch(e){setStatus('auth-status',e.message,'error')}});
$('#logout').addEventListener('click',async()=>{try{await post('logout',{token:state.token})}catch{}state.token='';state.user=null;sessionStorage.removeItem('rakhi_session');loadDashboard();toast('Signed out.')});
$('#checkout-form').addEventListener('submit',async e=>{e.preventDefault();if(!state.token){location.hash='#account';return}const lines=state.cart.map(x=>({id:x.id,quantity:x.quantity}));const btn=$('button[type="submit"]',e.currentTarget);btn.disabled=true;setStatus('checkout-status','Sending…');try{const r=await post('submitorder',{token:state.token,items:lines,...formObject(e.currentTarget),requestKey:crypto.randomUUID()});setStatus('checkout-status',r.message,'ok');state.cart=[];persistCart();renderCart();toast('Order request sent.')}catch(err){setStatus('checkout-status',err.message,'error')}finally{btn.disabled=false}});
$('#staff-form').addEventListener('submit',async e=>{e.preventDefault();const d=formObject(e.currentTarget);try{const r=await post('login',d);state.token=r.token;state.user=r.user;sessionStorage.setItem('rakhi_session',r.token);await loadStaff()}catch(err){setStatus('staff-status',err.message,'error')}});
loadPublic();if(state.token&&location.hash==='#account')loadDashboard();
})();

</script>
